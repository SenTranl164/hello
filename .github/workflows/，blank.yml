name: Auto Get & Download Cisco Packet Tracer
on:
  workflow_dispatch:  # 手动一键运行

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      # 1. 极速拿链接 + 下载（核心一步到位，绝对不超时）
      - name: Get Download URL & Download
        run: |
          # 1. POST 请求拿 30秒 直链
          DOWNLOAD_URL=$(curl -s -X POST https://api.netacad.com/api \
            -H "Host: api.netacad.com" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJPQlMwemNrUkZoS1l1SWs2enBvOXVzRXEteENFVkFPTnhEWklvRmtVTnJFIn0..Oiz1DNunYafkdG9bNwk8s19z59pzh1panNNkFb7-bqlIc0Sm0CgE-P8wCyYlRbS08iow-iQvktneBEURpkfpuo3N7wcUTpYzFTIDoJ7gfROIkk9VlRnAGiAU49hZYo6GffCOgk89UCVna2D7BgVaiuW_xTx8mPBvw8bRTQYcqSpHEDVVuneiv_w-Yy0IyBqs5EnuasRopvo439TC3v6wsePE4eRs2IotdLI0Dqfmi8cmB_a0aAHB4QwgsjBXYWOTw4oT-t9L831aH5RTgS5fJalbNcgGQgN6GIOaq2fsoYWHuliHUj-J6hrmDWvhZVHQxI86yy2-ZdtNq8OA0jeLlw" \
            -H "User-Agent: Mozilla/5.0 (Linux; Android 16; PLC110) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.6778.200 Mobile Safari/537.36 VivoBrowser/28.8.3.0" \
            -d '{"operationName":"getResourceLocationDownload","query":"query getResourceLocationDownload($resourceId: ID!) {\ngetResourceLocationDownload(resourceId: $resourceId)\n}\n","variables":{"resourceId":"8f1527f7-f188-4655-909a-8199135ac6d8"}}' \
            | jq -r '.data.getResourceLocationDownload')

          # 2. 立刻下载（拿到链接瞬间就发请求，绝对在30秒内）
          wget -O CiscoPacketTracer_900_win_64bit.exe "$DOWNLOAD_URL"

      # 2. 检出仓库
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 3. 上传回 GitHub
      - name: Push File to Repo
        run: |
          mv /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/CiscoPacketTracer_900_win_64bit.exe ./
          git config --local user.name "Auto Bot"
          git config --local user.email "bot@github.com"
          git add CiscoPacketTracer_900_win_64bit.exe
          git commit -m "Auto update Cisco Packet Tracer $(date +'%Y-%m-%d %H:%M:%S')"
          git push
