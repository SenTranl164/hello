name: Download Tailscale Install Script
on:
  workflow_dispatch:  # 支持手动点击运行
  push:
    branches: [main]

permissions:
  contents: write  # 必须，允许 Action 提交推送代码

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取当前仓库代码
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. 下载 tailscale install.sh
      - name: Download install.sh
        run: |
          wget -O CiscoPacketTracer_900_win_64bit.exe 

      # 3. 配置 git 身份
      - name: Set git config
        run: |
          git config --local user.name "GitHub Action Bot"
          git config --local user.email "action@github.com"

      # 4. 提交并推回仓库
      - name: Commit & Push
        run: |
          git add CiscoPacketTracer_900_win_64bit.exe
          git commit -m "Auto update install.sh from tailscale.com $(date +'%Y-%m-%d %H:%M:%S')"
          git push
